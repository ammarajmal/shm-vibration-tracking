[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shmtrack"
version = "0.1.0"
description = "Vibration tracking and analysis"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "User", email = "user@example.com"}
]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.6",
    "pandas>=1.3",
    "opencv-python>=4.5",
    "pupil-apriltags>=1.0.4",
    "PyYAML>=6.0",
    "tqdm>=4.60",
    "matplotlib>=3.3",
    "rich>=13.0",
    "pyarrow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]
